name = "katiesk9s-vet-auth"
main = "worker.js"
compatibility_date = "2024-11-01"

# Free persistent logs in the Cloudflare dashboard (~3 day retention).
# The worker only logs outcomes, never submission contents / PII.
[observability]
enabled = true

# Public config (not secrets).
[vars]
# The only browser origin allowed to POST.
ALLOWED_ORIGIN = "https://katiesk9s.co.uk"
# Where registration notification emails are delivered.
EMAIL_TO = "katies-k9s@hotmail.com"
# Sender. Must be on a domain verified in Resend (see README).
EMAIL_FROM = "Katie's K9s <registrations@notifications.katiesk9s.co.uk>"

# R2 bucket binding. Create the bucket first (see README), then deploy.
[[r2_buckets]]
binding = "R2_BUCKET"
bucket_name = "katiesk9s-vet-auth"

# ── Secrets (do NOT put values here) ─────────────────────────────────────────
# Set each with `wrangler secret put <NAME>` and paste the value when prompted.
#
#   RESEND_API_KEY   — Resend API key used to email registrations to EMAIL_TO.
#   MAKE_WEBHOOK_URL — Make.com webhook the worker forwards submissions to.
