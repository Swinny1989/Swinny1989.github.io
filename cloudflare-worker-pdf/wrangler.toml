name = "katiesk9s-vet-auth"
main = "worker.js"
compatibility_date = "2024-11-01"

# Public var (not a secret) — the only browser origin allowed to POST.
[vars]
ALLOWED_ORIGIN = "https://katiesk9s.co.uk"

# R2 bucket binding. Create the bucket first (see README), then deploy.
[[r2_buckets]]
binding = "R2_BUCKET"
bucket_name = "katiesk9s-vet-auth"
